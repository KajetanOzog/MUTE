runtime:
  dtype: bfloat16
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.9
  max_model_len: 4096
  max_num_seqs: 256
  enforce_eager: false
  max_tokens: 256
  temperature: 0.0
  seed: 42
models:
  qwen3-8b-base:
    path: Qwen/Qwen3-8B
    chat_template:
      enable_thinking: false
  qwen3.5-9b-generator:
    path: Qwen/Qwen3.5-9B
    chat_template:
      enable_thinking: false
  qwen3-32b-judge:
    path: Qwen/Qwen3-32B
    chat_template:
      enable_thinking: false
  qwen3-14b:
    path: Qwen/Qwen3-14B
    chat_template:
      enable_thinking: false
  llama-3.1-8b-instruct:
    path: meta-llama/Llama-3.1-8B-Instruct
    chat_template: {}
  mistral-7b-instruct:
    path: mistralai/Mistral-7B-Instruct-v0.3
    chat_template: {}
generator:
  model: qwen3.5-9b-generator
  runtime:
    dtype: bfloat16
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.82
    max_model_len: 16384
    max_num_seqs: 1
    enforce_eager: false
    language_model_only: true
    max_tokens: 2200
    temperature: 0.9
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    seed: 7
search:
  target_model: qwen3-8b-base
  seed: 7
  generator_seed: 7
  num_candidates: 24
  prompts_per_call: 6
  max_generation_attempts: 12
  allow_partial_population: true
  top_k: 5
  mutation_rounds: 3
  datasets:
    train_retain: dataset/train/retain/retain_alpaca_all_cat.jsonl
    retain_sample_size: 300
    retain_sample_seed: 7
  meta_prompts:
    directory: meta_prompts
    initial: '{category}/{brand_slug}/meta_{brand_slug}.txt'
    mutation: '{category}/{brand_slug}/mutation_{brand_slug}.txt'
  candidate_role: system
  candidate_input_template: '{question}'
judge:
  model: qwen3-32b-judge
  runtime:
    dtype: bfloat16
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_model_len: 2048
    max_num_seqs: 64
    enforce_eager: false
    max_tokens: 128
    temperature: 0.0
    seed: 42
  evaluation:
    evaluators:
      target_brand_present:
        system_prompt: eval/prompts/system/target_brand.txt
        user_prompt: eval/prompts/user/target_brand_present.txt
        output:
          field: mentioned
          type: boolean
      target_trade_dress_present:
        system_prompt: eval/prompts/system/target_brand.txt
        user_prompt: eval/prompts/user/target_trade_dress_present.txt
        output:
          field: trade_dress_present
          type: boolean
      brands_mentioned:
        system_prompt: eval/prompts/system/brand_extraction.txt
        user_prompt: eval/prompts/user/brands_mentioned.txt
        output:
          field: brands
          type: string_list
      trade_dress_brands:
        system_prompt: eval/prompts/system/brand_extraction.txt
        user_prompt: eval/prompts/user/trade_dress_brands.txt
        output:
          field: brands
          type: string_list
      qa_correct:
        system_prompt: eval/prompts/system/qa.txt
        user_prompt: eval/prompts/user/qa_correct.txt
        output:
          field: correct
          type: boolean
      quality_1_5:
        system_prompt: eval/prompts/system/quality.txt
        user_prompt: eval/prompts/user/quality_1_5.txt
        output:
          field: score
          type: integer
    tasks:
      forget:
      - target_brand_present
      - target_trade_dress_present
      - brands_mentioned
      - trade_dress_brands
      retain:
      - qa_correct
